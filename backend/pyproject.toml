[project]
name = "vietnamesesignlanguagerecognition"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.11,<3.13"
# Only serving deps remain here (FastAPI + Gradio demo + ONNX models);
# training/export packages moved to a separate training repo.
dependencies = [
    "fastapi>=0.111.0",
    "uvicorn[standard]>=0.29.0",
    "httpx>=0.27.0",
    "gradio>=6.17.3",
    "mediapipe==0.10.21",
    "numpy",
    "onnxruntime-gpu==1.26.0",
    "openai>=2.44.0",
    "opencv-python==4.10.0.84",
    "pose-format==0.13.0",
    "pydantic-settings==2.14.2",
    "soundfile>=0.14.0",
    "torch==2.12.0",
    "torchvision==0.27.0",
    "vieneu>=2.7.0",
]

# CUDA 12.6 build for compatibility with driver 535 (CUDA 12.2);
# PyPI's default cu130 build needs a newer driver and falls back to CPU.
[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchvision = { index = "pytorch-cu126" }

# vieneu pulls in CPU onnxruntime, but we need onnxruntime-gpu (same module
# name, can't install both); this always-false marker excludes the CPU build.
[tool.uv]
override-dependencies = ["onnxruntime; sys_platform == 'never'"]

