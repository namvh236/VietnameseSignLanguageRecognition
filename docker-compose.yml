services:
  # Ollama hosts Qwen3 1.7B (GPU) for sentence building in the Gradio demo (backend/demo_gradio.py).
  # First time: docker compose exec ollama ollama pull qwen3:1.7b
  ollama:
    image: ollama/ollama:latest
    container_name: signspeak-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]

volumes:
  ollama_data:
    name: signspeak-ollama-data
